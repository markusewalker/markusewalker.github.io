<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="stars"></div>

    <div class="scoreboard-overlay">
        <div class="scoreboard-team">
            <span class="team-name">YOU</span>
            <span class="team-score" id="score-you">0</span>
        </div>
        <span class="scoreboard-vs">VS</span>
        <div class="scoreboard-team">
            <span class="team-name">TMZ</span>
            <span class="team-score" id="score-tmz">0</span>
        </div>
    </div>

    <audio id="background-music" loop preload="auto">
        <source src="../assets/bg-music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="music-controls">
        <button id="music-toggle" title="Toggle Background Music">
            <i class="fas fa-volume-mute"></i>
        </button>
    </div>

    <nav class="navbar minimal-navbar">
        <div class="hamburger-menu">
            <input id="menu__toggle" type="checkbox" />
            <label class="menu__btn" for="menu__toggle">
            <span></span>
            </label>
            <ul class="menu__box">
                <li><a class="menu__item" href="../">Home</a></li>
                <li><a class="menu__item" href="about">About</a></li>
                <li><a class="menu__item" href="github">Github</a></li>
                <li><a class="menu__item" href="https://www.linkedin.com/in/markuswalker" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
            </ul>
        </div>
        <div class="navbar-content">
            <a class="nav-logo" href="../">MW</a>
            <div class="nav-links" role="navigation" aria-label="Main">
                <a class="nav-link" href="about">About</a>
                <a class="nav-link" href="github">GitHub</a>
                <a class="nav-link" href="https://www.linkedin.com/in/markuswalker" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="centered-card" style="max-width:700px;">
            <h2 class="markus-zone-title">Resume</h2>
            <div class="resume-image-viewer" style="width:100%;max-width:650px;margin:0 auto 1.5em auto;">
                <a href="../assets/markus-walker-resume.png" target="_blank" rel="noopener" title="Open resume in new tab">
                    <img src="../assets/markus-walker-resume.png" alt="Resume image" style="width:100%;height:auto;box-shadow:0 2px 16px rgba(0,0,0,0.12);border-radius:12px;cursor:pointer;" loading="lazy">
                </a>
            </div>
                <a href="../assets/markus-walker-resume.pdf" download class="resume-download-btn" style="display:inline-block;padding:0.7em 2em;margin-bottom:0.5em;background:#ffd700;color:#222;font-weight:700;border-radius:2em;text-decoration:none;box-shadow:0 2px 8px #0003;transition:background 0.2s;">Download PDF</a>
        </div>
    </main>
</body>

    <button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">
        <i class="fas fa-chevron-up" aria-hidden="true"></i>
    </button>

    <script src="../assets/scripts.js"></script>
</html>
